  </defs>
  <style>
    .a{stroke-dasharray:140;stroke-dashoffset:140;animation:draw .7s .1s cubic-bezier(.45,0,.2,1) forwards}
    .beat{stroke-dasharray:230;stroke-dashoffset:230;animation:draw 1.15s .65s cubic-bezier(.45,0,.2,1) forwards}
    .caret{opacity:0;animation:land .01s 1.85s forwards, blink 1.1s 1.95s steps(1) infinite}
