name: macOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A push to a branch with an open pull request would otherwise start two
# identical runs, and a new push should supersede an in-flight one.
concurrency:
  group: macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and test
        working-directory: app
        run: >-
          xcodebuild -project AirScribe.xcodeproj -scheme AirScribe
          -configuration Debug -destination 'platform=macOS,arch=arm64'
          CODE_SIGNING_ALLOWED=NO test
      - name: Verify Release build
        working-directory: app
        run: >-
          xcodebuild -project AirScribe.xcodeproj -scheme AirScribe
          -configuration Release -destination 'platform=macOS,arch=arm64'
          ARCHS=arm64 CODE_SIGNING_ALLOWED=NO build
