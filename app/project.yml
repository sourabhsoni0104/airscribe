name: AirScribe
options:
  bundleIdPrefix: com.airscribe
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
packages:
  SpeechSwift:
    url: https://github.com/soniqo/speech-swift.git
    revision: 17be126693b620fe53da9c18cd018d4d581e3149
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle.git
    from: 2.9.2
targets:
  AirScribe:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
    info:
      path: Config/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        LSUIElement: true
        CFBundleURLTypes:
          - CFBundleURLName: com.airscribe.mac
            CFBundleURLSchemes:
              - airscribe
        NSMicrophoneUsageDescription: AirScribe uses your microphone to transcribe speech locally on your Mac.
        NSSpeechRecognitionUsageDescription: AirScribe uses on-device speech recognition to turn your voice into text.
        NSScreenCaptureUsageDescription: AirScribe reads visible text only when you enable screen context or start meeting capture.
        SUFeedURL: https://raw.githubusercontent.com/sourabhsoni0104/airscribe/main/appcast.xml
        SUPublicEDKey: bEaPXjQrKtJAcxhEJIrLfowyAXJ/NEzSAj6jNIkybBY=
        SUEnableAutomaticChecks: true
        SUAutomaticallyUpdate: true
        SUAllowsAutomaticUpdates: true
    entitlements:
      path: Config/AirScribe.entitlements
      properties:
        com.apple.security.device.audio-input: true
    dependencies:
      - package: SpeechSwift
        product: Qwen3ASR
      - package: SpeechSwift
        product: AudioCommon
      - package: SpeechSwift
        product: WhisperASR
      - package: Sparkle
        product: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.airscribe.mac
        PRODUCT_NAME: AirScribe
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        ENABLE_HARDENED_RUNTIME: YES
  AirScribeTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: AirScribe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.airscribe.mac.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
schemes:
  AirScribe:
    build:
      targets:
        AirScribe: all
        AirScribeTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AirScribeTests
